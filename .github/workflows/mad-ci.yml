name: MAD CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  mad-ci-verify:
    name: mad-ci-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: test_linter (extractor de definiciones)
        run: node tools/test_linter.cjs

      - name: test_pack
        run: node tools/test_pack.cjs

      - name: test_release_gate
        run: node tools/test_release_gate.cjs

      - name: test_impact_lite
        run: node tools/test_impact_lite.cjs
